# Vol+/Vol- step the Headphone mixer; 63, its maximum, is the vendor cap. Holding FN while pressing Vol steps the backlight.
KEY_VOLUMEUP	1	/usr/bin/amixer -q sset Headphone 3+
KEY_VOLUMEUP	2	/usr/bin/amixer -q sset Headphone 3+
KEY_VOLUMEDOWN	1	/usr/bin/amixer -q sset Headphone 3-
KEY_VOLUMEDOWN	2	/usr/bin/amixer -q sset Headphone 3-
KEY_VOLUMEUP+KEY_FN	1	/usr/local/sbin/ga36-brightness /sys/class/backlight/backlight up
KEY_VOLUMEDOWN+KEY_FN	1	/usr/local/sbin/ga36-brightness /sys/class/backlight/backlight down
# FN+Start leaves Heroes 3; stopping the unit brings ES back.
BTN_START+KEY_FN	1	/usr/bin/systemctl stop ga36-vcmi.service
